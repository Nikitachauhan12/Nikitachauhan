<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form :</h1>
    <form>
        <label for ="fname">First Name:</label>
        <input type="text" id="fname" name="fname" placeholder="Enter first name"><br><br>

        <label for ="mname">Middle Name:</label>
        <input type="text" id="mname" placeholder="Enter middle name"><br><br>

        <label for ="lname">Last Name:</label>
        <input type="text" id="lname" placeholder="Enter last name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="Email" name="email" placeholder="Enter email"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter phone number"><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age"><br><br>

        <label for="dob">Date of Birth:</label>
        <input typr="date" id="dob" name="dob"><br><br>

        <label>Gender:</label>
        <br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <input type="submit" value="submit">
    </form>
    
</body>
</html>
